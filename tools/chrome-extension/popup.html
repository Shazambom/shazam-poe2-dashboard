<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; background: #191b22; color: #e8e4da; width: 300px; margin: 0; padding: 14px; }
  label { display: block; color: #8f95a5; font-size: 12px; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; background: #20232c; color: inherit; border: 1px solid #464b5c; border-radius: 4px; padding: 6px 8px; margin-bottom: 10px; }
  button { width: 100%; background: #c9a24a; color: #1b1608; border: 0; border-radius: 4px; padding: 8px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
  #msg { margin-top: 10px; font-size: 12.5px; min-height: 16px; }
  .ok { color: #6fb98f; } .err { color: #d2705f; }
</style>
</head>
<body>
  <label for="server">Dashboard address</label>
  <input id="server" placeholder="http://192.168.1.250:8080">
  <button id="go">Connect trade session</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
