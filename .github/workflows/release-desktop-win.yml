name: Build Windows desktop app

# The Windows desktop app is FULLY SELF-CONTAINED: it ships its own PyInstaller-built
# backend + local DB and only ever calls the server for updates. PyInstaller cannot
# cross-compile, so the Windows backend .exe MUST be built here on a real windows-latest
# runner; the installer is then attached to the desktop-v<ver> GitHub Release, which is the
# update channel electron-updater's `github` provider reads.
on:
  push:
    # Stable: desktop-v<ver>. Beta (dev): bare-semver `<ver>-beta.N` (electron-updater's prerelease
    # channel path parses the tag as semver, which the desktop-v prefix breaks). See release-runbook.
    tags:
      - 'desktop-v*'
      - '*-beta.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundled backend (PyInstaller, Windows x64)
        # The SAME script the Mac build runs (it picks the Windows add-data separator + venv
        # layout from uname), so the two platforms can't drift on PyInstaller flags.
        shell: bash
        run: PY=python bash desktop/build-backend.sh
      - name: Build heavy-analytics sidecar (PyInstaller, Windows x64)
        # A SEPARATE binary from the backend so the backend stays lean; the backend spawns +
        # supervises it. Phase 7a: NUMPY ONLY — the matrix-profile + DTW jobs were reimplemented
        # in pure numpy (proven 1:1 with stumpy/dtaidistance by test_sidecar_equivalence), so
        # there's no native code to crash the frozen binary on Windows and no --collect-all needed.
        shell: bash
        run: PY=python bash desktop/build-sidecar.sh
      - name: Smoke-run the frozen sidecar on Windows (crash gate)
        # Run the FROZEN .exe in the same environment that built it and exercise both heavy jobs'
        # compute path via --selftest. This is the faithful reproduction of the v0.2.49 field
        # crash: if a bundled dep faults natively (STATUS_ACCESS_VIOLATION 0xC0000005) the process
        # exits non-zero and this step fails RED — so a numpy-only regression can never ship again.
        shell: bash
        run: |
          desktop/sidecar-bin/poe2arb-sidecar.exe --selftest
          echo "frozen sidecar selftest exit code: $?"
      - name: Install node deps
        run: |
          cd frontend && npm ci
          cd ../desktop && npm ci
      - name: Fetch bundled market snapshot (seed)
        # The seed is the disposable market/backfill data (docs/db-architecture.md) so a
        # fresh install starts with a full history instead of a slow cold crawl. CI can't
        # reach the LAN, so shazam publishes it as an asset on the `market-seed-latest`
        # release; we download it here to bundle via extraResources.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p desktop/market-seed
          if gh release download market-seed-latest \
               --pattern 'market-seed.sqlite.gz*' \
               --dir desktop/market-seed --clobber; then
            ls -la desktop/market-seed
          else
            echo "::error::market-seed-latest release/asset not found. Publish a seed first (ops/export-market-snapshot.py -> gh release)."
            exit 1
          fi
      - name: Build frontend + Windows installer (x64, backend bundled)
        # Code signing: set repo secrets WIN_CSC_LINK (base64 of your .pfx) and
        # WIN_CSC_KEY_PASSWORD to sign automatically. Without them electron-builder builds
        # UNSIGNED (SmartScreen will warn, but auto-update still works after the installer
        # self-heal fix). Signing removes the SmartScreen warning + improves update trust.
        shell: bash          # bash for the -beta rename test below (default on Windows is PowerShell)
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          cd desktop
          npm run build:frontend
          npx electron-builder --win --x64 --publish never
          # electron-builder names the manifest latest.yml regardless of the -beta version tag. For a
          # beta (dev) release, rename to beta.yml so beta clients fetch it and stable's latest.yml is
          # never touched (a beta build must emit ONLY beta.yml).
          if [[ "${{ github.ref_name }}" == *-beta* ]]; then mv -f release/latest.yml release/beta.yml; fi
      - name: Upload installer to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # A `-beta` tag is a DEV channel release: mark it a GitHub pre-release so it's never "Latest"
          # and stable users (allowPrerelease=false) never pull it. electron-builder emits beta.yml for
          # a -beta version; the *.yml glob uploads whichever channel manifest was written.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          files: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/*.zip
            desktop/release/latest.yml
            desktop/release/beta.yml
      - name: Also upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
