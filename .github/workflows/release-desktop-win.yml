name: Build Windows desktop app

# The Windows desktop app is FULLY SELF-CONTAINED: it ships its own PyInstaller-built
# backend + local DB and only ever calls the server for updates. PyInstaller cannot
# cross-compile, so the Windows backend .exe MUST be built here on a real windows-latest
# runner; the installer is then attached to the desktop-v<ver> GitHub Release, which is the
# update channel electron-updater's `github` provider reads.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundled backend (PyInstaller, Windows x64)
        shell: bash
        run: |
          python -m pip install --quiet -r backend/requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile \
            --name poe2arb-backend \
            --paths backend \
            --add-data "backend/data;data" \
            --collect-all pyrate_limiter \
            backend/run_desktop.py
          mkdir -p desktop/backend-bin
          cp dist/poe2arb-backend.exe desktop/backend-bin/poe2arb-backend.exe
          ls -la desktop/backend-bin
      - name: Install node deps
        run: |
          cd frontend && npm ci
          cd ../desktop && npm ci
      - name: Fetch bundled market snapshot (seed)
        # The seed is the disposable market/backfill data (docs/db-architecture.md) so a
        # fresh install starts with a full history instead of a slow cold crawl. CI can't
        # reach the LAN, so shazam publishes it as an asset on the `market-seed-latest`
        # release; we download it here to bundle via extraResources.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p desktop/market-seed
          if gh release download market-seed-latest \
               --pattern 'market-seed.sqlite.gz*' \
               --dir desktop/market-seed --clobber; then
            ls -la desktop/market-seed
          else
            echo "::error::market-seed-latest release/asset not found. Publish a seed first (ops/export-market-snapshot.py -> gh release)."
            exit 1
          fi
      - name: Build frontend + Windows installer (x64, backend bundled)
        # Code signing: set repo secrets WIN_CSC_LINK (base64 of your .pfx) and
        # WIN_CSC_KEY_PASSWORD to sign automatically. Without them electron-builder builds
        # UNSIGNED (SmartScreen will warn, but auto-update still works after the installer
        # self-heal fix). Signing removes the SmartScreen warning + improves update trust.
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          cd desktop
          npm run build:frontend
          npx electron-builder --win --x64 --publish never
      - name: Upload installer to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/*.zip
            desktop/release/latest.yml
      - name: Also upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
