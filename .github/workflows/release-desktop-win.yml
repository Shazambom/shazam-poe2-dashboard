name: Build Windows desktop app
run-name: Windows build ${{ inputs.tag }}

# The Windows desktop app is FULLY SELF-CONTAINED: it ships its own PyInstaller-built
# backend + local DB and only ever calls the server for updates. PyInstaller cannot
# cross-compile, so the Windows backend .exe MUST be built here on a real windows-latest
# runner; the installer is then attached to the desktop-v<ver> GitHub Release, which is the
# update channel electron-updater's `github` provider reads.
# Started ONLY by desktop/publish-github.sh (`gh workflow run … -f tag= -f sha=`), never by a tag
# push: the tag must not exist until the release goes public. GitHub's releases.atom — what
# electron-updater's beta path reads — lists bare tags, so a tag pushed up front made every beta
# client chase a manifest that wasn't public yet for the whole build (0.2.61-beta.1, 65 min).
# Publishing the draft creates the tag, so tag + release + files appear in the same instant.
on:
  workflow_dispatch:
    inputs:
      tag:
        # Stable: desktop-v<ver>. Beta (dev): bare-semver `<ver>-beta.N` (electron-updater's prerelease
        # channel path parses the tag as semver, which the desktop-v prefix breaks). See release-runbook.
        description: 'Release tag the draft was created for (desktop-v<ver> or <ver>-beta.N)'
        required: true
      sha:
        description: 'Commit to build (the draft release targets the same commit)'
        required: true

permissions: {}

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
      - name: Build bundled backend + sidecar (PyInstaller, Windows x64)
        # The SAME script the Mac build runs (it picks the Windows add-data separator + venv
        # layout from uname), so the two platforms can't drift on PyInstaller flags. The backend
        # binary also dispatches `--sidecar` (sharing Python + numpy instead of shipping a second
        # copy) and build-backend.sh runs `--sidecar --selftest` as the Windows crash gate.
        shell: bash
        run: PY=python bash desktop/build-backend.sh
      - name: Smoke-run the frozen sidecar dispatch on Windows (crash gate)
        # Exercise both heavy jobs' compute path via --sidecar --selftest in the frozen .exe.
        shell: bash
        run: |
          desktop/backend-bin/poe2arb-backend.exe --sidecar --selftest
          echo "frozen sidecar selftest exit code: $?"
      - name: Install node deps
        run: |
          cd frontend && npm ci
          cd ../desktop && npm ci
      - name: Fetch bundled market snapshot (seed)
        # The seed is the disposable market/backfill data (docs/db-architecture.md) so a
        # fresh install starts with a full history instead of a slow cold crawl. CI can't
        # reach the LAN, so shazam publishes it as an asset on the `market-seed-latest`
        # release; we download it here to bundle via extraResources.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The SAME script as the Mac build: it waits out the cron's replace window and fails rather
        # than build seedless; publish-github.sh requires its "seed ready" line in this run's log.
        run: bash desktop/fetch-seed.sh
      - name: Build frontend + Windows installer (x64, backend bundled)
        # Code signing: set repo secrets WIN_CSC_LINK (base64 of your .pfx) and
        # WIN_CSC_KEY_PASSWORD to sign automatically. Without them electron-builder builds
        # UNSIGNED (SmartScreen will warn, but auto-update still works after the installer
        # self-heal fix). Signing removes the SmartScreen warning + improves update trust.
        shell: bash          # bash for the -beta rename test below (default on Windows is PowerShell)
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd desktop
          npm run build:frontend
          npx electron-builder --win --x64 --publish never
          # electron-builder names the manifest latest.yml regardless of the -beta version tag. For a
          # beta (dev) release, rename to beta.yml so beta clients fetch it and stable's latest.yml is
          # never touched (a beta build must emit ONLY beta.yml).
          if [[ "$RELEASE_TAG" == *-beta* ]]; then mv -f release/latest.yml release/beta.yml; fi
      - name: Upload installer into the DRAFT release
        # The release stays a draft (invisible to electron-updater, never "Latest") until
        # desktop/publish-github.sh has added the Mac files, verified both platforms and flipped it
        # public — so clients never see a manifest whose installer isn't there yet
        # (docs/bugs/2026-09-17-release-publish-not-atomic.md). Same tool the Mac side uses:
        # installers first, manifest LAST, stale half-created assets cleared, timeout + retries.
        timeout-minutes: 75
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          TAG="$RELEASE_TAG"
          node desktop/scripts/release-assets.mjs ensure-draft "$TAG" "$RELEASE_SHA"
          # Only the files this build produced (a beta emits beta.yml, a stable latest.yml).
          FILES=()
          for f in desktop/release/*.exe desktop/release/*.exe.blockmap desktop/release/*.zip \
                   desktop/release/latest.yml desktop/release/beta.yml; do
            [ -f "$f" ] && FILES+=("$f")
          done
          node desktop/scripts/release-assets.mjs upload "$TAG" "${FILES[@]}"
      - name: Also upload as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
