server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_read_timeout 300s;
    proxy_buffering off;    # SSE: stream route events through as they're emitted
    proxy_cache off;
  }
  location = /callback {
    proxy_pass http://backend:8000/callback;
  }
  location /downloads/ {
    alias /downloads/;
    autoindex on;             # desktop app installers + electron-updater latest*.yml
  }
  location / { try_files $uri /index.html; }
}
